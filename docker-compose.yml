# Social Automation Hub: n8n + PostgreSQL 16 + NocoDB (+ optional Caddy for HTTPS)
#
#   docker compose up -d                   # core stack (n8n, postgres, nocodb)
#   docker compose --profile https up -d   # + Caddy reverse proxy with automatic Let's Encrypt
#
# All settings come from .env (create it with scripts/generate-env.sh).

name: social-hub

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    # PostgreSQL 16 as specified. n8n 2.x logs that 16 gets "compatibility support"
    # only; for a fresh install consider POSTGRES_VERSION=17 (upgrading later needs dump/restore).
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: social-hub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # No host port: only n8n and NocoDB reach the DB, over the internal network.
    # For a GUI client, use an SSH tunnel: ssh -L 5432:<container-ip>:5432 ...
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  n8n:
    <<: *restart
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    container_name: social-hub-n8n
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Bound to localhost by default. Put Caddy (profile "https") or your existing
      # reverse proxy in front, because Telegram webhooks require public HTTPS anyway.
      - "${N8N_BIND_IP:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      # --- Database ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # --- Core ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_PORT: 5678
      N8N_LISTEN_ADDRESS: 0.0.0.0 # default '::' crashes on hosts/containers without IPv6
      N8N_HOST: ${N8N_DOMAIN:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_EDITOR_BASE_URL: ${WEBHOOK_URL}
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      N8N_RUNNERS_TASK_TIMEOUT: 300
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false" # no community nodes needed; smaller attack surface
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336 # hours (14 days)
      # Workflows read the non-secret IDs below through $env. Secrets are NOT
      # passed here: they live in encrypted n8n credentials (scripts/bootstrap.sh).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID}
      FB_GRAPH_VERSION: ${FB_GRAPH_VERSION:-v19.0}
      TWITTER_USER_ID: ${TWITTER_USER_ID}
      TWITTER_USERNAME: ${TWITTER_USERNAME:-}
      MENTION_MIN_SCORE: ${MENTION_MIN_SCORE:-7}
      ANTHROPIC_MODEL_COPY: ${ANTHROPIC_MODEL_COPY:-claude-sonnet-5}
      ANTHROPIC_MODEL_CLASSIFIER: ${ANTHROPIC_MODEL_CLASSIFIER:-claude-haiku-4-5}
      # API base URLs are overridable only so the test suite can point at mocks.
      CLAUDE_API_BASE_URL: ${CLAUDE_API_BASE_URL:-https://api.anthropic.com}
      FB_GRAPH_BASE_URL: ${FB_GRAPH_BASE_URL:-https://graph.facebook.com}
      TWITTER_API_BASE_URL: ${TWITTER_API_BASE_URL:-https://api.x.com}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/opt/social-hub/workflows:ro
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  nocodb:
    <<: *restart
    image: nocodb/nocodb:${NOCODB_VERSION:-latest}
    container_name: social-hub-nocodb
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${NOCODB_BIND_IP:-127.0.0.1}:${NOCODB_PORT:-8080}:8080"
    environment:
      # NocoDB's own metadata lives in the "nocodb" DB. The CMS tables live in
      # "social_hub": connect it once as a data source in the NocoDB UI (README).
      NC_DB: "pg://postgres:5432?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=nocodb"
      NC_AUTH_JWT_SECRET: ${NOCODB_JWT_SECRET}
      NC_PUBLIC_URL: ${NOCODB_PUBLIC_URL:-}
      NC_DISABLE_TELE: "true"
      TZ: ${TZ:-UTC}
    volumes:
      - nocodb_data:/usr/app/data
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  caddy:
    <<: *restart
    image: caddy:2-alpine
    container_name: social-hub-caddy
    profiles: ["https"]
    depends_on: [n8n, nocodb]
    ports:
      - "80:80"
      - "443:443"
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN}
      NOCODB_DOMAIN: ${NOCODB_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]

networks:
  backend:
    internal: false # n8n/NocoDB need outbound internet (APIs, image pulls)
  frontend:

volumes:
  postgres_data:
  n8n_data:
  nocodb_data:
  caddy_data:
  caddy_config:
