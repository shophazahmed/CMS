# /etc/nginx/sites-available/vote.seenu.online
# deploy/setup_vps.sh installs this after the certificate has been issued
# (until then it serves only the port-80 block below, for the ACME challenge).

limit_req_zone $binary_remote_addr zone=voter_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=voter_general:10m rate=20r/s;

upstream voter_portal {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name vote.seenu.online;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vote.seenu.online;

    ssl_certificate     /etc/letsencrypt/live/vote.seenu.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vote.seenu.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:voter_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;
    client_max_body_size 6m;

    access_log /var/log/nginx/vote.access.log;
    error_log  /var/log/nginx/vote.error.log;

    location = /login {
        limit_req zone=voter_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://voter_portal;
        include /etc/nginx/proxy_params;
    }

    # Import page: workbooks with embedded photos can be large
    location = /admin/import {
        client_max_body_size 300m;
        proxy_request_buffering off;
        proxy_pass http://voter_portal;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
    }

    location /static/ {
        alias /opt/voter-portal/app/static/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        limit_req zone=voter_general burst=40 nodelay;
        proxy_pass http://voter_portal;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
    }
}
