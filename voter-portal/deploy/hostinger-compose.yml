# Hostinger "Docker + Traefik" VPS: deployed as project "voter-portal" via the Hostinger API / hPanel.
# Builds straight from the GitHub branch; Traefik (host network) routes vote.seenu.online here.
# Project environment: VOTER_PORTAL_SECRET_KEY, VOTER_PORTAL_ADMIN_PASSWORD (first start only).
name: voter-portal

services:
  app:
    build:
      context: https://github.com/shophazahmed/CMS.git#claude/amazing-mccarthy-f6k50g:voter-portal
    image: voter-portal-app:latest
    restart: unless-stopped
    environment:
      VOTER_PORTAL_SECRET_KEY: ${VOTER_PORTAL_SECRET_KEY:?set VOTER_PORTAL_SECRET_KEY}
      VOTER_PORTAL_ADMIN_PASSWORD: ${VOTER_PORTAL_ADMIN_PASSWORD:-}
      VOTER_PORTAL_DATA_DIR: /data
      GUNICORN_BIND: 0.0.0.0:8000
      GUNICORN_WORKERS: "3"
      FORWARDED_ALLOW_IPS: "*"
      TZ: Indian/Maldives
    volumes:
      - voter-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.voter-portal.rule=Host(`vote.seenu.online`)
      - traefik.http.routers.voter-portal.entrypoints=websecure
      - traefik.http.routers.voter-portal.tls.certresolver=letsencrypt
      - traefik.http.routers.voter-portal.middlewares=voter-portal-headers,voter-portal-ratelimit
      - traefik.http.middlewares.voter-portal-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.voter-portal-ratelimit.ratelimit.average=20
      - traefik.http.middlewares.voter-portal-ratelimit.ratelimit.burst=40
      - traefik.http.services.voter-portal.loadbalancer.server.port=8000
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  voter-data:
