name: voter-portal
services:
  app:
    image: python:3.12-slim
    restart: unless-stopped
    environment:
      VOTER_PORTAL_SECRET_KEY: ${VOTER_PORTAL_SECRET_KEY}
      VOTER_PORTAL_ADMIN_PASSWORD: ${VOTER_PORTAL_ADMIN_PASSWORD}
      VOTER_PORTAL_DATA_DIR: /data
      GUNICORN_BIND: 0.0.0.0:8000
      GUNICORN_WORKERS: 3
      FORWARDED_ALLOW_IPS: '*'
      PYTHONUNBUFFERED: 1
      TZ: Indian/Maldives
    volumes:
      - voter-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        rm -rf /tmp/src
        python -c "import io,tarfile,urllib.request as u;tarfile.open(fileobj=io.BytesIO(u.urlopen('https://codeload.github.com/shophazahmed/CMS/tar.gz/refs/heads/claude/amazing-mccarthy-f6k50g',timeout=60).read())).extractall('/tmp/src',filter='data')"
        cd /tmp/src/CMS-*/voter-portal
        pip install -q --no-cache-dir --root-user-action=ignore -r requirements.txt
        mkdir -p /data/photos && chown -R 1000:1000 /data && chmod 700 /data
        exec setpriv --reuid=1000 --regid=1000 --clear-groups gunicorn -c deploy/gunicorn.conf.py wsgi:app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/login', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
    labels:
      - traefik.enable=true
      - traefik.http.routers.voter-portal.rule=Host(`vote.seenu.online`)
      - traefik.http.routers.voter-portal.entrypoints=websecure
      - traefik.http.routers.voter-portal.tls.certresolver=letsencrypt
      - traefik.http.routers.voter-portal.middlewares=voter-portal-headers,voter-portal-ratelimit
      - traefik.http.middlewares.voter-portal-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.voter-portal-ratelimit.ratelimit.average=20
      - traefik.http.middlewares.voter-portal-ratelimit.ratelimit.burst=40
      - traefik.http.services.voter-portal.loadbalancer.server.port=8000
    deploy:
      resources:
        limits:
          memory: 768m
volumes:
  voter-data:
