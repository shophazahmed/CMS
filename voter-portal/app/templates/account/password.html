{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<form class="card form narrow" method="post" action="{{ url_for('auth.change_password') }}">
  <h1>Change password</h1>
  {% if current_user.must_change_password %}
  <p class="muted">You're using a temporary password. Choose your own to continue.</p>
  {% endif %}
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Current password
    <input name="current_password" type="password" autocomplete="current-password" required>
  </label>
  <label>New password <span class="muted">(at least 10 characters)</span>
    <input name="new_password" type="password" autocomplete="new-password" minlength="10" required>
  </label>
  <label>Repeat new password
    <input name="confirm_password" type="password" autocomplete="new-password" minlength="10" required>
  </label>
  <button class="primary">Change password</button>
</form>
{% endblock %}
