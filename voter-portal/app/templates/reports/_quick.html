{# Box and Agent filters at the top of a report page; keeps every other filter and the report choice. #}
<form class="card report-pick report-quick no-print" method="get">
  {% for k, v in request.args.items() if k not in ('ag', 'loc', 'page') %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
  <label>Box
    <select name="loc" data-autosubmit>
      <option value="">All boxes</option>
      {% for b in boxes %}<option value="{{ b }}" {{ 'selected' if f.loc == b }}>{{ b }}</option>{% endfor %}
      <option value="(none)" {{ 'selected' if f.loc == '(none)' }}>No box recorded</option>
    </select>
  </label>
  {% if agents %}
  <label>Agent
    <select name="ag" data-autosubmit>
      <option value="">All agents</option>
      <option value="none" {{ 'selected' if f.ag == 'none' }}>No agent</option>
      {% for a in agents %}<option value="{{ a.id }}" {{ 'selected' if f.ag == a.id|string }}>{{ a.username }}</option>{% endfor %}
    </select>
  </label>
  {% endif %}
  {% if f.loc or f.ag %}<a class="small-text" href="{{ url_for(request.endpoint, **dict(request.view_args or {}, **dict(request.args.items()|list, loc=None, ag=None))) }}">Show everyone</a>{% endif %}
  <noscript><button class="small">Show</button></noscript>
</form>
