{% extends "base.html" %}
{% from "_macros.html" import avatar %}
{% block title %}{{ 'Add voter' if creating else 'Edit ' ~ v.full_name }}{% endblock %}
{% block content %}
<form class="card form" method="post" enctype="multipart/form-data"
      action="{{ url_for('voters.create') if creating else url_for('voters.edit', national_id=v.national_id) }}">
  <h1>{{ 'Add voter' if creating else 'Edit voter' }}</h1>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>ID card
    {% if creating %}
    <input name="national_id" value="{{ v.national_id or '' }}" placeholder="A123456" required maxlength="20">
    {% else %}
    <input value="{{ v.national_id }}" disabled>
    {% endif %}
  </label>
  <label>Full name
    <input name="full_name" value="{{ v.full_name or '' }}" required maxlength="200">
  </label>
  <div class="row">
    <label>Sex
      <select name="sex">
        <option value="" {{ 'selected' if not v.sex }}>Not recorded</option>
        <option value="M" {{ 'selected' if v.sex == 'M' }}>Male</option>
        <option value="F" {{ 'selected' if v.sex == 'F' }}>Female</option>
      </select>
    </label>
    <label>Age
      <input name="age" type="number" min="0" max="130" value="{{ v.age if v.age is not none else '' }}">
    </label>
  </div>
  <label>House name
    <input name="house_name" value="{{ v.house_name or '' }}" maxlength="200">
  </label>
  <label>Party
    <input name="party" value="{{ v.party or '' }}" maxlength="50">
  </label>
  <label>Photo (JPEG, PNG or WebP, up to 5 MB)
    <input name="photo" type="file" accept="image/jpeg,image/png,image/webp">
  </label>
  {% if not creating and v.photo_path %}
  <label class="check">{{ avatar(v) }} <input type="checkbox" name="remove_photo" value="1"> Remove current photo</label>
  {% endif %}
  <div class="actions">
    <button class="primary">{{ 'Add voter' if creating else 'Save changes' }}</button>
    <a class="button" href="{{ url_for('voters.search') if creating else url_for('voters.detail', national_id=v.national_id) }}">Cancel</a>
  </div>
</form>
{% endblock %}
