<form class="card filters pledge-filters" method="get">
  {% for k in ('sort', 'dir', 'bs', 'bd', 'pb', 'sc', 'n') %}{% if request.args.get(k) %}<input type="hidden" name="{{ k }}" value="{{ request.args[k] }}">{% endif %}{% endfor %}
  <label>Search
    <input type="search" name="q" value="{{ f.q }}" placeholder="Name, ID, house, phone">
  </label>
  <label>Box
    <select name="loc">
      <option value="">All boxes</option>
      {% for b in box_list_options %}<option value="{{ b }}" {{ 'selected' if f.loc == b }}>{{ b }}</option>{% endfor %}
      <option value="(none)" {{ 'selected' if f.loc == '(none)' }}>No box recorded</option>
    </select>
  </label>
  <label>House
    <input name="house" value="{{ f.house }}" placeholder="House name">
  </label>
  <label>Sex
    <select name="sex">
      <option value="">Any</option>
      <option value="M" {{ 'selected' if f.sex == 'M' }}>Male</option>
      <option value="F" {{ 'selected' if f.sex == 'F' }}>Female</option>
    </select>
  </label>
  <label>Age
    <span class="range">
      <input type="number" inputmode="numeric" name="age_min" min="0" max="130" value="{{ f.age_min if f.age_min is not none }}" placeholder="from" aria-label="Age from">
      <span class="muted">–</span>
      <input type="number" inputmode="numeric" name="age_max" min="0" max="130" value="{{ f.age_max if f.age_max is not none }}" placeholder="to" aria-label="Age to">
    </span>
  </label>
  {% if with_pledge_filter %}
  <label>Pledge
    <span class="range">
      <select name="pc" aria-label="Candidate">
        <option value="">Any candidate</option>
        <option value="any" {{ 'selected' if pc == 'any' }}>Any of them</option>
        {% for c in cands %}<option value="{{ c.id }}" {{ 'selected' if pc == c.id|string }}>{{ c.name }}</option>{% endfor %}
      </select>
      <select name="pv" aria-label="Pledge">
        <option value="">—</option>
        <option value="yes" {{ 'selected' if pv == 'yes' }}>Yes</option>
        <option value="maybe" {{ 'selected' if pv == 'maybe' }}>Maybe</option>
        <option value="no" {{ 'selected' if pv == 'no' }}>No</option>
        <option value="none" {{ 'selected' if pv == 'none' }}>Not marked</option>
        <option value="leaning" {{ 'selected' if pv == 'leaning' }}>Leaning (Maybe, no Yes)</option>
        <option value="undecided" {{ 'selected' if pv == 'undecided' }}>Undecided (no mark)</option>
      </select>
    </span>
  </label>
  {% endif %}
  {% if cands|length > 1 %}
  <label>Pledge pattern
    <select name="pp">
      <option value="">Any</option>
      <optgroup label="Yes for only one candidate">
        {% for c in cands %}<option value="only:{{ c.id }}" {{ 'selected' if f.pp == 'only:' ~ c.id }}>Only {{ c.name }}</option>{% endfor %}
      </optgroup>
      <optgroup label="Shared supporters (Yes for both)">
        {% for a in cands %}{% set i = loop.index0 %}{% for b in cands[i + 1:] %}
        <option value="both:{{ a.id }}-{{ b.id }}" {{ 'selected' if f.pp == 'both:' ~ a.id ~ '-' ~ b.id }}>{{ a.name }} &amp; {{ b.name }}</option>
        {% endfor %}{% endfor %}
      </optgroup>
    </select>
  </label>
  {% endif %}
  {% set ag_list = agent_options() %}
  {% if ag_list %}
  <label>Agent
    <select name="ag">
      <option value="">Any agent</option>
      <option value="none" {{ 'selected' if f.ag == 'none' }}>No agent</option>
      {% for a in ag_list %}<option value="{{ a.id }}" {{ 'selected' if f.ag == a.id|string }}>{{ a.username }}</option>{% endfor %}
    </select>
  </label>
  {% endif %}
  <label>No-show
    <select name="ns">
      <option value="">Everyone</option>
      <option value="0" {{ 'selected' if f.ns == '0' }}>Hide no-shows</option>
      <option value="1" {{ 'selected' if f.ns == '1' }}>Only no-shows</option>
    </select>
  </label>
  <div class="actions">
    <button class="primary">Apply</button>
    {% if request.args %}<a class="button" href="{{ url_for(request.endpoint) }}">Clear</a>{% endif %}
  </div>
</form>
