  wf_02_telegram_approval_handler:
    content: |
      {
        "id": "shTgApproval0002",
        "name": "02 - Telegram Approval & Team Input",
        "active": false,
        "nodes": [
          {
            "id": "e9816991-ea41-5218-a340-90f22389aca9",
            "name": "Telegram Trigger",
            "type": "n8n-nodes-base.telegramTrigger",
            "typeVersion": 1.2,
            "position": [
              0,
              600
            ],
            "parameters": {
              "updates": [
                "message",
                "callback_query"
              ],
              "additionalFields": {}
            },
            "credentials": {
              "telegramApi": {
                "id": "shCredTelegram01",
                "name": "Telegram Bot"
              }
            },
            "webhookId": "73f16975-9e6c-5936-999e-9e87f71e0aa4"
          },
          {
            "id": "995f1825-6371-5c9b-8d80-ba9e568d787c",
            "name": "Parse Update",
            "type": "n8n-nodes-base.code",
            "typeVersion": 2,
            "position": [
              240,
              600
            ],
            "parameters": {
              "jsCode": "// Telegram allows ONE webhook per bot, so this workflow is the single entry\n// point for every button (drafts from 01 and mentions from 03) and message.\nconst u = $$input.first().json;\nconst adminChat = String($$env.TELEGRAM_ADMIN_CHAT_ID || '');\nconst allowedUsers = String($$env.TELEGRAM_ALLOWED_USER_IDS || '')\n  .split(',').map((s) => s.trim()).filter(Boolean);\nconst ROUTES = [\"approve\", \"regen\", \"reject\", \"edit\", \"retweet\", \"ignore\", \"edit_reply\", \"new_content\", \"help\", \"drop\"];\nconst out = { route: 'drop' };\n\nif (u.callback_query) {\n  const q = u.callback_query;\n  Object.assign(out, {\n    kind: 'callback',\n    callback_query_id: q.id,\n    chat_id: String(q.message?.chat?.id ?? ''),\n    message_id: String(q.message?.message_id ?? ''),\n    original_text: q.message?.text || '',\n    user_id: String(q.from?.id ?? ''),\n    user_name: q.from?.username ? '@' + q.from.username : (q.from?.first_name || 'someone'),\n  });\n  const [cmd, a, b] = String(q.data || '').split(':');\n  if (cmd === 'a')  Object.assign(out, { route: 'approve', target_id: b,\n      target_platform: a === 'fb' ? 'FACEBOOK_ONLY' : a === 'tw' ? 'TWITTER_ONLY' : 'ALL' });\n  if (cmd === 'rg') Object.assign(out, { route: 'regen',   target_id: a });\n  if (cmd === 'rj') Object.assign(out, { route: 'reject',  target_id: a });\n  if (cmd === 'ed') Object.assign(out, { route: 'edit',    target_id: a });\n  if (cmd === 'rt') Object.assign(out, { route: 'retweet', target_id: a });\n  if (cmd === 'ig') Object.assign(out, { route: 'ignore',  target_id: a });\n} else if (u.message) {\n  const m = u.message;\n  const text = (m.text || m.caption || '').trim();\n  const photos = m.photo || [];\n  Object.assign(out, {\n    kind: 'message',\n    chat_id: String(m.chat?.id ?? ''),\n    message_id: String(m.message_id ?? ''),\n    user_id: String(m.from?.id ?? ''),\n    user_name: m.from?.username ? '@' + m.from.username : (m.from?.first_name || 'someone'),\n    text,\n    photo_file_id: photos.length ? photos[photos.length - 1].file_id : '',  // largest size\n    reply_to_message_id: m.reply_to_message ? String(m.reply_to_message.message_id) : '',\n  });\n  if (/^\\/(start|help|id)(@\\w+)?$$/i.test(text)) out.route = 'help';\n  else if (m.from?.is_bot) out.route = 'drop';\n  else if (out.reply_to_message_id && text) out.route = 'edit_reply';\n  else if (text.startsWith('/')) out.route = 'drop';\n  else if (text || out.photo_file_id) out.route = 'new_content';\n}\n\n// Security: only the admin chat may act (/help and /id answer anywhere so you\n// can discover the chat ID during setup).\nconst authorized = out.chat_id && out.chat_id === adminChat &&\n  (!allowedUsers.length || allowedUsers.includes(out.user_id));\nif (!authorized && out.route !== 'help') out.route = 'drop';\nout.authorized = !!authorized;\nout.route_index = ROUTES.indexOf(out.route);\nreturn [{ json: out }];\n"
            }
          },
          {
            "id": "4c968020-841f-5347-8d9a-7612dd832735",
            "name": "Route Action",
            "type": "n8n-nodes-base.switch",
            "typeVersion": 3.2,
            "position": [
              480,
              600
            ],
            "parameters": {
              "mode": "expression",
              "numberOutputs": 10,
              "output": "={{ $$json.route_index }}"
            }
          },
          {
            "id": "e5bedd57-1793-52b1-8918-2fb199856317",
            "name": "Answer: Publishing",
            "type": "n8n-nodes-base.telegram",
            "typeVersion": 1.2,
            "position": [
              760,
              -400
            ],
            "parameters": {
              "resource": "callback",
              "operation": "answerQuery",
              "queryId": "={{ $$('Parse Update').item.json.callback_query_id }}",
              "additionalFields": {
                "text": "🚀 Publishing…"
              }
            },
            "credentials": {
              "telegramApi": {
                "id": "shCredTelegram01",
                "name": "Telegram Bot"
              }
            },
            "onError": "continueRegularOutput"
          },
          {
            "id": "2913862a-ebcd-5d13-90ee-81248bdfda5c",
            "name": "Claim Post for Publishing",
            "type": "n8n-nodes-base.postgres",
            "typeVersion": 2.5,
            "position": [
              1000,
              -400
            ],
            "parameters": {
              "operation": "executeQuery",
              "query": "WITH r AS (\nUPDATE content_queue\n   SET status = 'APPROVED', target_platform = $$2, approved_by = $$3\n WHERE id = $$1::int AND status = 'PENDING_APPROVAL'\nRETURNING id AS post_id, target_platform\n)\nSELECT * FROM r;",
              "options": {
                "queryReplacement": "={{ [$$('Parse Update').item.json.target_id, $$('Parse Update').item.json.target_platform, $$('Parse Update').item.json.user_name] }}"
              }
            },
            "credentials": {
              "postgres": {
                "id": "shCredPostgres01",
                "name": "Social Hub DB"
              }
            }
          },
          {
            "id": "1a44ccf2-7651-5321-bef0-ba8b355606b2",
            "name": "Run Publisher (04)",
            "type": "n8n-nodes-base.executeWorkflow",
            "typeVersion": 1.2,
            "position": [
              1240,
              -400
            ],
            "parameters": {
              "source": "database",
              "workflowId": {
                "__rl": true,
                "mode": "id",
                "value": "shPublisher00004"
              },
              "mode": "each",
              "options": {
                "waitForSubWorkflow": true
              }
            }
          },
          {
            "id": "8b8e6f1f-bfe6-550d-915e-6ee7176adb2b",
            "name": "Format Publish Result",
            "type": "n8n-nodes-base.code",
            "typeVersion": 2,
            "position": [
              1480,
              -400
            ],
            "parameters": {
              "jsCode": "const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');\n\nconst r = $$input.first().json;\nconst p = $$('Parse Update').first().json;\nconst handle = $$env.TWITTER_USERNAME || 'i';\nconst lines = [];\nif (r.fb_post_id) lines.push(`📘 FB post: $${esc(r.fb_post_id)}`);\nif (r.tweet_id) lines.push(`🐦 X: https://x.com/$${handle}/status/$${r.tweet_id}`);\nconst head = r.status === 'PUBLISHED'\n  ? `✅ <b>Published</b> by $${esc(p.user_name)}`\n  : `⚠️ <b>Publishing failed</b> (draft #$${r.id}): $${esc(r.error_message || 'unknown error')}`;\nreturn [{ json: { text: esc(p.original_text) + '\\n\\n' + head + (lines.length ? '\\n' + lines.join('\\n') : '') } }];\n"
            }
          },
          {
            "id": "23252cbb-2b43-598c-9188-05d8c1142131",
            "name": "Mark Published",
            "type": "n8n-nodes-base.telegram",
            "typeVersion": 1.2,
            "position": [
              1720,
              -400
            ],
            "parameters": {
              "operation": "editMessageText",
              "messageType": "message",
              "chatId": "={{ $$('Parse Update').item.json.chat_id }}",
              "messageId": "={{ $$('Parse Update').item.json.message_id }}",
              "text": "={{ $$json.text }}",
              "additionalFields": {
                "parse_mode": "HTML",
                "disable_web_page_preview": true
              }
            },
            "credentials": {
              "telegramApi": {
                "id": "shCredTelegram01",
                "name": "Telegram Bot"
              }
            },
            "onError": "continueRegularOutput"
          },
          {
            "id": "a292f1ca-d4df-5175-b07f-b82a07b58c62",
            "name": "Answer: Regenerating",
            "type": "n8n-nodes-base.telegram",
            "typeVersion": 1.2,
            "position": [
              760,
              -140
            ],
            "parameters": {
              "resource": "callback",
              "operation": "answerQuery",
              "queryId": "={{ $$('Parse Update').item.json.callback_query_id }}",
              "additionalFields": {
                "text": "♻️ Writing a new version…"
              }
            },
            "credentials": {
              "telegramApi": {
                "id": "shCredTelegram01",
                "name": "Telegram Bot"
              }
            },
            "onError": "continueRegularOutput"
          },
          {
            "id": "b0fa16e1-c23b-586c-90f2-e0afcdcfbd63",
            "name": "Claim Post for Regen",
            "type": "n8n-nodes-base.postgres",
            "typeVersion": 2.5,
            "position": [
              1000,
