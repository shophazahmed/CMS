      traefik.http.services.social-hub-cms.loadbalancer.server.port: '8080'
networks:
  backend:
    internal: false
  frontend: null
volumes:
  postgres_data: null
  n8n_data: null
  nocodb_data: null
configs:
  pg_init_dbs:
    content: |
      #!/bin/bash
      # Runs once, on first boot of an empty Postgres volume.
      # POSTGRES_DB (social_hub) holds the CMS/app tables; n8n and NocoDB each get
      # their own database for internal metadata so they never collide.
      set -euo pipefail
      for db in n8n nocodb; do
        psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<-SQL
          SELECT 'CREATE DATABASE $$db OWNER "$$POSTGRES_USER"'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$$db')\gexec
      SQL
      done
  pg_schema:
    content: |
      -- Social Automation Hub - CMS schema (database: social_hub)
      -- Runs once on first boot of an empty Postgres volume. Safe to re-run manually.
      -- Plain TEXT + CHECK constraints instead of Postgres ENUMs so NocoDB shows
      -- them as editable single-selects and adding a status never needs a migration.

      CREATE TABLE IF NOT EXISTS campaigns (
          id              SERIAL PRIMARY KEY,
          name            VARCHAR(200) NOT NULL,
          is_active       BOOLEAN NOT NULL DEFAULT TRUE,
          priority        INT NOT NULL DEFAULT 0,          -- highest active campaign wins the daily slot
          brand_name      VARCHAR(200),
          audience        TEXT,
          tone_guidelines TEXT,                            -- voice/tone rules fed to Claude
          topics          TEXT,                            -- themes / talking points
          hashtags        TEXT,                            -- preferred hashtags (use sparingly)
          cta_url         TEXT,                            -- link for the Facebook call-to-action
          language        VARCHAR(20) NOT NULL DEFAULT 'en',
          created_at      TIMESTAMPTZ NOT NULL DEFAULT now(),
          updated_at      TIMESTAMPTZ NOT NULL DEFAULT now()
      );

      CREATE TABLE IF NOT EXISTS media_assets (
          id          SERIAL PRIMARY KEY,
          campaign_id INT REFERENCES campaigns(id) ON DELETE SET NULL,  -- NULL = usable by any campaign
          url         TEXT NOT NULL,                                     -- public https URL (jpg/png)
          alt_text    TEXT,
          tags        TEXT,
          is_active   BOOLEAN NOT NULL DEFAULT TRUE,
          created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
      );

      CREATE TABLE IF NOT EXISTS social_accounts (
          id                  SERIAL PRIMARY KEY,
          platform            TEXT NOT NULL CHECK (platform IN ('FACEBOOK', 'TWITTER')),
          account_name        VARCHAR(200) NOT NULL,
          platform_account_id VARCHAR(100) NOT NULL,
          -- MVP publishes with the tokens in .env / n8n credentials (encrypted by n8n).
          -- These columns exist for the multi-account phase; avoid storing live tokens
          -- here until the CMS is locked down, because NocoDB users can read them.
          access_token        TEXT,
          refresh_token       TEXT,
          is_active           BOOLEAN NOT NULL DEFAULT TRUE,
          created_at          TIMESTAMPTZ NOT NULL DEFAULT now(),
          UNIQUE (platform, platform_account_id)
      );

      CREATE TABLE IF NOT EXISTS content_queue (
          id                     SERIAL PRIMARY KEY,
          campaign_id            INT REFERENCES campaigns(id) ON DELETE SET NULL,
          created_by             TEXT NOT NULL DEFAULT 'AI_AGENT'
                                 CHECK (created_by IN ('AI_AGENT', 'TEAM_MEMBER', 'TWITTER_MONITOR')),
          source                 TEXT NOT NULL DEFAULT 'AI_CRON'
                                 CHECK (source IN ('AI_CRON', 'MANUAL_TEAM', 'TWITTER_MONITOR')),
          fb_copy                TEXT,
          twitter_copy           TEXT,
          -- https://... public URL, or tg://<file_id> for photos sent to the bot
          -- (the publisher downloads those from Telegram at publish time).
          media_url              TEXT,
          status                 TEXT NOT NULL DEFAULT 'DRAFT'
                                 CHECK (status IN ('DRAFT', 'PENDING_APPROVAL', 'APPROVED',
                                                   'PUBLISHED', 'FAILED', 'REJECTED')),
          target_platform        TEXT NOT NULL DEFAULT 'ALL'
                                 CHECK (target_platform IN ('ALL', 'FACEBOOK_ONLY', 'TWITTER_ONLY')),
          scheduled_at           TIMESTAMPTZ,
          published_at           TIMESTAMPTZ,
          fb_post_id             VARCHAR(100),
          tweet_id               VARCHAR(100),
          error_message          TEXT,
          regen_count            INT NOT NULL DEFAULT 0,
          approved_by            VARCHAR(100),
          telegram_chat_id       VARCHAR(50),
          telegram_message_id    VARCHAR(50),   -- preview message with the approval keyboard
          edit_prompt_message_id VARCHAR(50),   -- ForceReply prompt for the [Edit] flow
          created_at             TIMESTAMPTZ NOT NULL DEFAULT now(),
          updated_at             TIMESTAMPTZ NOT NULL DEFAULT now()
      );
      CREATE INDEX IF NOT EXISTS content_queue_status_idx ON content_queue (status);
      CREATE INDEX IF NOT EXISTS content_queue_edit_prompt_idx ON content_queue (edit_prompt_message_id);

      CREATE TABLE IF NOT EXISTS mentions (
          id                  SERIAL PRIMARY KEY,
          tweet_id            VARCHAR(40) NOT NULL UNIQUE,
          author_id           VARCHAR(40),
          author_username     VARCHAR(100),
          author_followers    INT,
          text                TEXT,
          tweet_created_at    TIMESTAMPTZ,
          ai_score            INT,             -- 0-10 value score from the Claude classifier
          ai_verdict          TEXT,            -- HIGH_VALUE | LOW_VALUE | SPAM | NEGATIVE | UNSAFE
          ai_reason           TEXT,
          status              TEXT NOT NULL DEFAULT 'NEW'
                              CHECK (status IN ('NEW', 'FILTERED', 'NOTIFIED', 'RETWEETING',
                                                'RETWEETED', 'IGNORED', 'FAILED')),
          telegram_message_id VARCHAR(50),
          error_message       TEXT,
          created_at          TIMESTAMPTZ NOT NULL DEFAULT now(),
          updated_at          TIMESTAMPTZ NOT NULL DEFAULT now()
      );

      -- Small key/value store for workflow cursors (e.g. Twitter since_id).
      CREATE TABLE IF NOT EXISTS app_state (
          key        VARCHAR(100) PRIMARY KEY,
          value      TEXT,
          updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
      );

      -- Keep updated_at honest when rows are edited from NocoDB.
      CREATE OR REPLACE FUNCTION touch_updated_at() RETURNS trigger AS $$$$
      BEGIN
          NEW.updated_at := now();
          RETURN NEW;
      END;
      $$$$ LANGUAGE plpgsql;

      DO $$$$
      DECLARE t TEXT;
      BEGIN
          FOREACH t IN ARRAY ARRAY['campaigns', 'content_queue', 'mentions', 'app_state'] LOOP
              EXECUTE format('DROP TRIGGER IF EXISTS %I_touch ON %I', t, t);
              EXECUTE format('CREATE TRIGGER %I_touch BEFORE UPDATE ON %I
                              FOR EACH ROW EXECUTE FUNCTION touch_updated_at()', t, t);
          END LOOP;
      END $$$$;

      -- Starter campaign so Workflow 1 has something to work with on day one.
      -- Edit it in NocoDB (or deactivate it and add your own).
      INSERT INTO campaigns (name, priority, brand_name, audience, tone_guidelines, topics, hashtags, cta_url)
      SELECT 'Default Brand Campaign', 0, 'YourBrand',
             'Small-business owners who follow us on Facebook and X',
             'Friendly, confident, plain English. No hype words, no emoji walls (max 2 emoji). Never invent facts, prices or stats.',
             'Practical tips related to our product; behind-the-scenes; customer wins',
             '#YourBrand',
             'https://example.com'
      WHERE NOT EXISTS (SELECT 1 FROM campaigns);
  setup_sh:
    content: |
      #!/bin/sh
      # One-shot: load credentials + workflows into n8n's database, then publish them.
      # Runs on every deploy, so changing a token in the project environment and
      # redeploying updates the stored credential.
      set -e
      node /opt/setup/render-creds.js
      n8n import:credentials --input=/tmp/sh-creds.json
      rm -f /tmp/sh-creds.json
      n8n import:workflow --separate --input=/opt/setup/workflows
      for id in shPublisher00004 shDailyAiGen0001 shTwListener0003 shTgApproval0002; do n8n publish:workflow --id="$$id"; done
      echo "social-hub setup complete"
  render_creds_js:
    content: |
      const e = process.env;
      const g = (k) => e[k] || '';
      const creds = [
        { id: 'shCredPostgres01', name: 'Social Hub DB', type: 'postgres',
          data: { host: 'postgres', port: 5432, database: g('POSTGRES_DB'), user: g('POSTGRES_USER'),
                  password: g('POSTGRES_PASSWORD'), ssl: 'disable', allowUnauthorizedCerts: false, maxConnections: 10 } },
        { id: 'shCredTelegram01', name: 'Telegram Bot', type: 'telegramApi',
          data: { accessToken: g('TELEGRAM_BOT_TOKEN'), baseUrl: g('TELEGRAM_API_BASE_URL') || 'https://api.telegram.org' } },
        { id: 'shCredAnthropic1', name: 'Anthropic API Key', type: 'httpHeaderAuth',
          data: { name: 'x-api-key', value: g('ANTHROPIC_API_KEY') } },
        { id: 'shCredFbPage0001', name: 'Facebook Page Token', type: 'httpQueryAuth',
          data: { name: 'access_token', value: g('FACEBOOK_PAGE_ACCESS_TOKEN') } },
        { id: 'shCredXBearer001', name: 'X Bearer Token', type: 'httpHeaderAuth',
          data: { name: 'Authorization', value: 'Bearer ' + g('TWITTER_BEARER_TOKEN') } },
        { id: 'shCredXOAuth1001', name: 'X OAuth1 User Context', type: 'oAuth1Api',
          data: { authUrl: 'https://api.x.com/oauth/authorize', accessTokenUrl: 'https://api.x.com/oauth/access_token',
                  requestTokenUrl: 'https://api.x.com/oauth/request_token',
                  consumerKey: g('TWITTER_API_KEY'), consumerSecret: g('TWITTER_API_SECRET'), signatureMethod: 'HMAC-SHA1',
                  oauthTokenData: { oauth_token: g('TWITTER_ACCESS_TOKEN'), oauth_token_secret: g('TWITTER_ACCESS_SECRET') } } },
      ];
      require('fs').writeFileSync('/tmp/sh-creds.json', JSON.stringify(creds), { mode: 0o600 });
  wf_01_daily_ai_content_generator:
    content: |
      {
        "id": "shDailyAiGen0001",
        "name": "01 - Daily AI Content Generator",
        "active": false,
        "nodes": [
          {
            "id": "941c5f20-4a2c-531b-bb32-1ecaf1ec4e31",
            "name": "Every Day 08:00",
            "type": "n8n-nodes-base.scheduleTrigger",
            "typeVersion": 1.2,
            "position": [
              0,
              200
            ],
            "parameters": {
              "rule": {
                "interval": [
                  {
                    "field": "cronExpression",
                    "expression": "0 8 * * *"
                  }
                ]
              }
            }
          },
          {
            "id": "f172ac69-7ff3-5357-a1a2-a42685eaf1c8",
            "name": "Called by Approval Workflow",
            "type": "n8n-nodes-base.executeWorkflowTrigger",
            "typeVersion": 1.1,
            "position": [
              0,
              420
            ],
            "parameters": {
              "inputSource": "passthrough"
            }
          },
          {
            "id": "134649ef-b924-5e1f-a14e-1f707379f46a",
            "name": "Normalize Input",
            "type": "n8n-nodes-base.code",
            "typeVersion": 2,
            "position": [
              240,
              300
            ],
            "parameters": {
              "jsCode": "// Scheduled run -> new draft. Called from workflow 02 with\n// { post_id, mode: 'regen' | 'preview' } -> regenerate copy / just resend preview.\nconst j = $$input.first().json;\nconst mode = j.mode === 'regen' || j.mode === 'preview' ? j.mode : 'new';\nreturn [{ json: { mode, post_id: j.post_id ? String(j.post_id) : '' } }];\n"
            }
          },
          {
            "id": "90d8a497-4c81-5ae8-88ee-7c752b8afa4a",
            "name": "Preview Only?",
            "type": "n8n-nodes-base.switch",
            "typeVersion": 3.2,
            "position": [
              460,
              300
            ],
            "parameters": {
              "mode": "expression",
              "numberOutputs": 2,
              "output": "={{ $$json.mode === 'preview' ? 1 : 0 }}"
            }
          },
          {
            "id": "cc37c0f5-a74a-5130-9c15-84702e5e7723",
            "name": "Fetch Campaign Context",
            "type": "n8n-nodes-base.postgres",
            "typeVersion": 2.5,
            "position": [
              700,
              200
            ],
            "parameters": {
              "operation": "executeQuery",
              "query": "SELECT c.*,\n       COALESCE(\n         (SELECT q.media_url FROM content_queue q WHERE q.id = NULLIF($$1, '')::int),\n         (SELECT m.url FROM media_assets m\n           WHERE m.is_active AND (m.campaign_id = c.id OR m.campaign_id IS NULL)\n           ORDER BY random() LIMIT 1)\n       ) AS media_url,\n       (SELECT string_agg(r.twitter_copy, E'\\n- ')\n          FROM (SELECT twitter_copy FROM content_queue\n                 WHERE campaign_id = c.id AND status IN ('PUBLISHED', 'PENDING_APPROVAL')\n                 ORDER BY created_at DESC LIMIT 5) r) AS recent_posts,\n       (SELECT q.twitter_copy FROM content_queue q WHERE q.id = NULLIF($$1, '')::int) AS previous_draft\n  FROM campaigns c\n WHERE c.is_active\n   AND (NULLIF($$1, '') IS NULL\n        OR c.id = (SELECT campaign_id FROM content_queue WHERE id = NULLIF($$1, '')::int))\n ORDER BY c.priority DESC, c.id\n LIMIT 1;",
              "options": {
                "queryReplacement": "={{ [$$json.post_id] }}"
              }
            },
            "credentials": {
              "postgres": {
                "id": "shCredPostgres01",
                "name": "Social Hub DB"
              }
            }
          },
          {
            "id": "921c656d-71a3-5470-9e37-02aafae3c7ca",
            "name": "Build Claude Request",
            "type": "n8n-nodes-base.code",
            "typeVersion": 2,
            "position": [
              940,
              200
            ],
            "parameters": {
              "jsCode": "const c = $$input.first().json;\nconst mode = $$('Normalize Input').first().json.mode;\nconst today = $$now.toFormat('cccc, d LLLL yyyy');\nconst lines = [\n  `Today is $${today}.`,\n  `Brand: $${c.brand_name || c.name}`,\n  `Campaign: $${c.name}`,\n  c.audience ? `Audience: $${c.audience}` : '',\n  c.tone_guidelines ? `Tone guidelines: $${c.tone_guidelines}` : '',\n  c.topics ? `Topics / talking points: $${c.topics}` : '',\n  c.hashtags ? `Preferred hashtags: $${c.hashtags}` : '',\n  c.cta_url ? `CTA link for Facebook: $${c.cta_url}` : '',\n  `Language: $${c.language || 'en'}`,\n  c.media_url ? 'An image will be attached to the post; the copy should work with a photo.' : '',\n  c.recent_posts ? `Recent posts (do not repeat these angles):\\n- $${c.recent_posts}` : '',\n  mode === 'regen' && c.previous_draft\n    ? `The team rejected this draft and asked for a fresh take with a different angle:\\n\"$${c.previous_draft}\"`\n    : '',\n  '',\n  \"Write today's Twitter/X post and Facebook post.\",\n].filter(Boolean);\n\nreturn [{ json: {\n  campaign: c,\n  claude_request: {\n    model: $$env.ANTHROPIC_MODEL_COPY || 'claude-sonnet-5',\n    max_tokens: 4000,\n    system: \"You are the social media copywriter for a brand. You write one Twitter/X post and one Facebook post per request.\\nTwitter/X: max 260 characters (hard limit 280 incl. hashtags and links), a strong hook in the first line, at most 2 hashtags, no links unless provided.\\nFacebook: 60-180 words, story-driven, conversational, short paragraphs, ends with a clear call to action that includes the CTA link when one is given.\\nFollow the brand's tone guidelines exactly. Never invent facts, prices, statistics, customer names or quotes. Do not repeat the angle of the recent posts you are shown.\",\n    messages: [{ role: 'user', content: lines.join('\\n') }],\n    output_config: { format: { type: 'json_schema', schema: {\"type\": \"object\", \"properties\": {\"twitter_copy\": {\"type\": \"string\", \"description\": \"X/Twitter post, max 280 characters\"}, \"fb_copy\": {\"type\": \"string\", \"description\": \"Facebook post, story-driven, ends with CTA\"}, \"image_idea\": {\"type\": \"string\", \"description\": \"One-line idea for a matching image\"}}, \"required\": [\"twitter_copy\", \"fb_copy\", \"image_idea\"], \"additionalProperties\": false} } },\n  },\n}}];\n"
            }
          },
          {
            "id": "40d5c2a7-6901-5709-a051-5ffb0d4083c1",
            "name": "Claude: Generate Copy",
            "type": "n8n-nodes-base.httpRequest",
            "typeVersion": 4.2,
            "position": [
              1180,
              200
            ],
            "parameters": {
              "method": "POST",
              "url": "={{ $$env.CLAUDE_API_BASE_URL }}/v1/messages",
              "authentication": "genericCredentialType",
              "genericAuthType": "httpHeaderAuth",
              "options": {
                "timeout": 120000
              },
              "sendHeaders": true,
              "headerParameters": {
                "parameters": [
                  {
                    "name": "anthropic-version",
                    "value": "2023-06-01"
                  },
                  {
                    "name": "content-type",
                    "value": "application/json"
                  }
                ]
              },
              "sendBody": true,
              "specifyBody": "json",
              "jsonBody": "={{ JSON.stringify($$json.claude_request) }}"
            },
            "credentials": {
              "httpHeaderAuth": {
                "id": "shCredAnthropic1",
                "name": "Anthropic API Key"
              }
            },
            "retryOnFail": true,
            "maxTries": 3,
            "waitBetweenTries": 5000
          },
          {
            "id": "8291a48b-43b2-552a-a3a6-96b00e24f48e",
            "name": "Parse AI Output",
            "type": "n8n-nodes-base.code",
            "typeVersion": 2,
            "position": [
              1420,
              200
            ],
            "parameters": {
              "jsCode": "function claudeJson(resp) {\n  if (resp.error) throw new Error('Claude API error: ' + JSON.stringify(resp.error).slice(0, 500));\n  if (resp.stop_reason === 'refusal') throw new Error('Claude declined this request (refusal).');\n  if (resp.stop_reason === 'max_tokens') throw new Error('Claude output was cut off (max_tokens).');\n  const block = (resp.content || []).find((b) => b.type === 'text');\n  if (!block) throw new Error('No text block in Claude response');\n  return JSON.parse(block.text);\n}\n\nconst out = claudeJson($$input.first().json);\nconst c = $$('Build Claude Request').first().json.campaign;\nlet tw = String(out.twitter_copy || '').trim();\n// Twitter counts code points; cut at a word boundary if Claude overshot.\nif ([...tw].length > 280) tw = [...tw].slice(0, 279).join('').replace(/\\s+\\S*$$/, '') + '…';\nreturn [{ json: {\n  campaign_id: String(c.id),\n  campaign_name: c.name,\n  fb_copy: String(out.fb_copy || '').trim(),\n  twitter_copy: tw,\n  image_idea: out.image_idea || '',\n  media_url: c.media_url || '',\n  post_id: $$('Normalize Input').first().json.post_id,\n}}];\n"
            }
          },
          {
            "id": "9b872a12-164b-51dd-83d1-ad30c4233a04",
            "name": "Save Draft (PENDING_APPROVAL)",
            "type": "n8n-nodes-base.postgres",
            "typeVersion": 2.5,
            "position": [
              1660,
              200
            ],
            "parameters": {
              "operation": "executeQuery",
              "query": "WITH upd AS (\n  UPDATE content_queue\n     SET fb_copy = $$2, twitter_copy = $$3, status = 'PENDING_APPROVAL',\n         regen_count = regen_count + 1, error_message = NULL\n   WHERE id = NULLIF($$5, '')::int\n  RETURNING *\n), ins AS (\n  INSERT INTO content_queue (campaign_id, created_by, source, fb_copy, twitter_copy, media_url, status, target_platform)\n  SELECT $$1::int, 'AI_AGENT', 'AI_CRON', $$2, $$3, NULLIF($$4, ''), 'PENDING_APPROVAL', 'ALL'\n   WHERE NULLIF($$5, '') IS NULL\n  RETURNING *\n)\nSELECT r.*, c.name AS campaign_name\n  FROM (SELECT * FROM upd UNION ALL SELECT * FROM ins) r\n  LEFT JOIN campaigns c ON c.id = r.campaign_id;",
              "options": {
                "queryReplacement": "={{ [$$json.campaign_id, $$json.fb_copy, $$json.twitter_copy, $$json.media_url, $$json.post_id] }}"
              }
            },
            "credentials": {
              "postgres": {
                "id": "shCredPostgres01",
                "name": "Social Hub DB"
              }
            }
