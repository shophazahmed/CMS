            "typeVersion": 2.5,
            "position": [
              1660,
              420
            ],
            "parameters": {
              "operation": "executeQuery",
              "query": "SELECT q.*, c.name AS campaign_name\n  FROM content_queue q LEFT JOIN campaigns c ON c.id = q.campaign_id\n WHERE q.id = NULLIF($$1, '')::int;",
              "options": {
                "queryReplacement": "={{ [$$json.post_id] }}"
              }
            },
            "credentials": {
