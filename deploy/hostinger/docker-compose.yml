            "parameters": {
              "operation": "executeQuery",
              "query": "UPDATE content_queue SET telegram_message_id = $$1, telegram_chat_id = $$2\n WHERE id = $$3::int\nRETURNING id, status, telegram_message_id;",
              "options": {
                "queryReplacement": "={{ [String($$json.result.message_id), String($$json.result.chat.id), String($$('Format Telegram Preview').item.json.post_id)] }}"
              }
            },
            "credentials": {
              "postgres": {
                "id": "shCredPostgres01",
                "name": "Social Hub DB"
              }
            }
          }
        ],
        "connections": {
          "Every Day 08:00": {
