                  {
                    "row": {
                      "buttons": [
                        {
                          "text": "♻️ Regenerate",
                          "additionalFields": {
                            "callback_data": "=rg:{{ $$json.post_id }}"
                          }
                        },
                        {
                          "text": "✏️ Edit",
                          "additionalFields": {
                            "callback_data": "=ed:{{ $$json.post_id }}"
                          }
                        },
                        {
                          "text": "❌ Reject",
                          "additionalFields": {
                            "callback_data": "=rj:{{ $$json.post_id }}"
                          }
                        }
                      ]
                    }
                  }
                ]
              }
            },
            "credentials": {
              "telegramApi": {
                "id": "shCredTelegram01",
                "name": "Telegram Bot"
              }
            }
          },
          {
            "id": "d940b55d-e6d4-595c-a2b6-b7e4fbfd3e35",
            "name": "Store Telegram Message ID",
            "type": "n8n-nodes-base.postgres",
