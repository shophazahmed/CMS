              "jsCode": "const m = $$input.first().json;\nconst raw = m.text.startsWith('!raw');\nconst text = raw ? m.text.replace(/^!raw\\s*/, '') : m.text;\nreturn [{ json: {\n  raw, text, photo_file_id: m.photo_file_id,\n  claude_request: {\n    model: $$env.ANTHROPIC_MODEL_COPY || 'claude-sonnet-5',\n    max_tokens: 4000,\n    system: \"You are the social media copywriter for a brand. You write one Twitter/X post and one Facebook post per request.\\nTwitter/X: max 260 characters (hard limit 280 incl. hashtags and links), a strong hook in the first line, at most 2 hashtags, no links unless provided.\\nFacebook: 60-180 words, story-driven, conversational, short paragraphs, ends with a clear call to action that includes the CTA link when one is given.\\nFollow the brand's tone guidelines exactly. Never invent facts, prices, statistics, customer names or quotes. Do not repeat the angle of the recent posts you are shown.\",\n    messages: [{ role: 'user', content:\n      'A team member sent this content to publish' + (m.photo_file_id ? ' (with a photo)' : '') +\n      '. Adapt it into one X post and one Facebook post. Keep their facts, names and links exactly; ' +\n      'improve structure and hook only.\\n\\n<team_content>\\n' + (text || '(no text, write short copy for the photo)') + '\\n</team_content>' }],\n    output_config: { format: { type: 'json_schema', schema: {\"type\": \"object\", \"properties\": {\"twitter_copy\": {\"type\": \"string\", \"description\": \"X/Twitter post, max 280 characters\"}, \"fb_copy\": {\"type\": \"string\", \"description\": \"Facebook post, story-driven, ends with CTA\"}, \"image_idea\": {\"type\": \"string\", \"description\": \"One-line idea for a matching image\"}}, \"required\": [\"twitter_copy\", \"fb_copy\", \"image_idea\"], \"additionalProperties\": false} } },\n  },\n}}];\n"
