                "parse_mode": "HTML",
                "disable_web_page_preview": true
              },
              "replyMarkup": "inlineKeyboard",
              "inlineKeyboard": {
                "rows": [
                  {
                    "row": {
                      "buttons": [
                        {
                          "text": "✅ Approve All",
                          "additionalFields": {
                            "callback_data": "=a:all:{{ $$json.post_id }}"
                          }
                        },
                        {
                          "text": "📘 FB Only",
                          "additionalFields": {
                            "callback_data": "=a:fb:{{ $$json.post_id }}"
                          }
                        },
                        {
                          "text": "🐦 X Only",
